name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (GitHub Packages registry)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate contracts
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag: ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Git tag (v${TAG_VERSION}) difere de package.json version (${PKG_VERSION}). FAIL."
            exit 1
          fi

      - name: Fail if version already published
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "@whoo-internet-co/finance-platform-contracts@${PKG_VERSION}" version --registry=https://npm.pkg.github.com 2>/dev/null; then
            echo "::error::Versão ${PKG_VERSION} já publicada. Versões publicadas nunca são sobrescritas."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
